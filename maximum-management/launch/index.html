:root{
  color-scheme:only light;
  --cloth:#2c0d16; --cloth-lit:#4d1827; --paper:#fffdf9; --ink:#211c1d; --soft:#6a605e;
  --crimson:#a01c33; --brass:#cdaa6d; --ivory:#f3e9d8; --rule:#e4dcd2;
  --serif:"Alegreya","Tiro Devanagari Sanskrit",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --deva:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari",serif;
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--serif);color:var(--ink);background:var(--cloth)}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}
button:focus-visible,a:focus-visible,.sheet:focus-visible,.reader-body:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- the table the book lies on ---------- */
.app{height:100vh;height:100dvh;min-height:380px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:var(--ivory);
  background:
    repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 4px),
    radial-gradient(ellipse 80% 70% at 50% 46%,var(--cloth-lit) 0%,var(--cloth) 78%)}
.mast{min-height:58px;padding:10px clamp(16px,4vw,64px);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:700 clamp(15px,1.3vw,19px)/1.15 var(--serif);letter-spacing:.045em}
.brand em{font-weight:500;letter-spacing:0;color:#eba0ab}
.tools,.controls{display:flex;align-items:center;gap:8px}
.utility,.tool-icon,.btn{border:1px solid #cdaa6d73;background:transparent;color:var(--ivory);border-radius:3px;font:500 15px/1.1 var(--sans);letter-spacing:.01em;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:38px;padding:7px 13px;transition:background .15s,border-color .15s}
.utility:hover,.tool-icon:hover,.btn:not(:disabled):hover{border-color:var(--brass);background:#ffffff12}
.utility[aria-pressed=true]{background:#cdaa6d2e;border-color:var(--brass)}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.utility .label{white-space:nowrap}
.stage{display:grid;place-items:center;min-height:0;position:relative;touch-action:pan-y pinch-zoom;overflow:hidden}
.bottom{padding:12px 16px max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:18px}
.btn{min-width:44px;height:42px}
.btn:disabled{opacity:.3}
.btn.next{color:var(--cloth);background:var(--ivory);border-color:var(--ivory);font-weight:700;padding-inline:18px}
.btn.next:not(:disabled):hover{background:#fff;border-color:#fff}
.status{font:400 14px/1.2 var(--sans);letter-spacing:.03em;color:#e3d2bdcc;min-width:104px;text-align:center;font-variant-numeric:lining-nums}

/* ---------- book mechanics ---------- */
.book{position:relative;perspective:1900px;isolation:isolate;user-select:none;-webkit-user-select:none}
.sheet,.leaf{position:absolute;top:0;height:100%;width:var(--pw)}
.sheet{background:var(--paper);box-shadow:0 0 0 1px #0000002e,0 2px 4px #00000040,0 14px 26px -8px #0000008c,0 34px 60px -24px #000000b3}
.sheet.left{left:0}.sheet.right{right:0}.sheet.solo{left:50%;transform:translateX(-50%)}
.sheet.right:after,.sheet.left:after,.face:after{content:"";position:absolute;inset:0;pointer-events:none}
.sheet.right:after{background:linear-gradient(to right,#3d2a1f26,transparent 5%)}
.sheet.left:after{background:linear-gradient(to left,#3d2a1f26,transparent 5%)}
.leaf{z-index:4;transform-style:preserve-3d;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);box-shadow:0 1px 6px #00000040}
.face.back{transform:rotateY(180deg)}
.face:after{background:linear-gradient(to right,#3d2a1f1f,transparent 18%)}

/* ---------- a page: every measure is in em, 1em = page width / 40 ---------- */
.pg{position:absolute;inset:0;overflow:hidden;font-size:var(--u);padding:4.3em 4.2em 3.8em;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
.pc{font:400 1em/1.46 var(--serif);font-variant-numeric:oldstyle-nums;flex:1;min-height:0;display:flex;flex-direction:column;text-rendering:optimizeLegibility;font-kerning:normal}
.pc p{margin:0}
.pc em.title{font-style:italic;font-weight:500}
.pc img{display:block;mix-blend-mode:multiply;pointer-events:none}

/* endpapers */
.pg-blank{background:#8c1a2d;padding:0;align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,#a12338,#801628)}
.pg-blank svg{width:6.5em;height:5.2em;fill:none;stroke:#e9c98f;stroke-width:.9;stroke-linejoin:round;opacity:.75}

/* cover */
.pg-cover{padding:3.5em 3.2em 2.6em}
.pg-cover:before{content:"";position:absolute;inset:1.35em;border:1px solid #a01c3366;pointer-events:none}
.pg-cover:after{content:"";position:absolute;inset:1.75em;border:1px solid #a01c3326;pointer-events:none}
.cover{text-align:center;align-items:center}
.shloka{font:400 1.52em/1.72 var(--deva);color:var(--ink)}
.gloss{font-style:italic;font-weight:450;font-size:1.26em;line-height:1.4;color:#554c4a;margin-top:.95em!important;text-wrap:balance}
.invite{font-style:italic;font-weight:500;font-size:1.92em;line-height:1.2;color:var(--crimson);margin:.85em 0 0!important;padding:.62em 0 .7em;position:relative;text-wrap:balance;max-width:15.5em}
.invite:before,.invite:after{content:"";position:absolute;left:50%;width:3.4em;margin-left:-1.7em;border-top:1px solid var(--crimson)}
.invite:before{top:0}.invite:after{bottom:0}
.cover .art{width:100%;max-width:33em;height:auto;min-height:0;flex:0 1 auto;object-fit:contain;margin:auto 0;padding-top:.9em}

/* the letter */
.letter{font-size:1.1em;line-height:1.72}
.salute{font-style:italic;font-weight:500;font-size:1.85em;line-height:1.15;color:var(--crimson);margin-bottom:.95em!important;overflow-wrap:anywhere;text-wrap:balance}
.letter .verse{font-style:italic;font-size:1.1em;line-height:1.55;margin-bottom:1.05em;padding-left:1.1em;border-left:1px solid var(--crimson)}
.letter .verse span{display:block}
.letter p+p{margin-top:.85em}
.letter .close{font-style:italic;margin-top:1.3em!important}
.letter .sign{font-style:italic;font-weight:500;font-size:2em;line-height:1.1;margin-top:.5em!important}

/* if you have ever */
.pg-ifever{padding-top:4.6em}
.ifever{text-align:center;justify-content:space-between}
.ifever .couplet{font-size:1.2em;line-height:1.32}
.ifever .couplet span{display:block}
.ifever .couplet span+span{font-style:italic;color:var(--crimson)}
.ifever .turn{font-style:italic;color:var(--soft);font-size:1.08em}
.ifever .verdict{font-size:1.62em;line-height:1.22;font-weight:500;text-wrap:balance;padding-top:.75em;position:relative}
.ifever .verdict:before{content:"";position:absolute;top:0;left:50%;width:3.4em;margin-left:-1.7em;border-top:1px solid var(--crimson)}
.ifever .verdict i{font-size:.78em;font-weight:400;color:var(--soft);display:block;margin:.12em 0}

/* about the book */
.about{font-size:1.1em}
.about .lead{font-size:1.95em;line-height:1.14;font-weight:500;margin-bottom:.5em;text-wrap:balance}
.about p+p{margin-top:.62em}
.about .danger{font-style:italic;font-size:1.3em;color:var(--crimson);margin:.75em 0 .7em!important}
.about .lenses{list-style:none;margin:.75em 0 .8em;padding:0;display:grid;row-gap:.3em;font-size:1.3em;line-height:1.2;font-weight:500}
.about .lenses li{display:flex;align-items:center;gap:.6em}
.about .lenses li:before{content:"";width:2.6em;height:.16em;border-radius:1em;background:var(--ray);flex:none}
.about .aim{margin-top:auto!important;padding-top:.9em;border-top:1px solid var(--rule)}
.about .aim b{display:block;font-size:1.95em;line-height:1.15;font-weight:500;font-style:italic;color:var(--crimson);margin-top:.12em}

/* programme */
.prog{font-size:1.1em}
.prog .welcome{text-align:center;font-size:1.26em;line-height:1.36;text-wrap:balance}
.prog .welcome+.welcome{margin-top:.6em}
.prog .mark{display:flex;align-items:center;gap:1em;margin:1.5em 0 1.25em;color:var(--crimson)}
.prog .mark:before,.prog .mark:after{content:"";flex:1;border-top:1px solid var(--rule)}
.prog .mark svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.prog h2{font:500 2.25em/1.1 var(--serif);margin:0 0 .5em}
.prog section{padding:1em 0 1.05em;border-top:1px solid var(--rule)}
.prog section:first-of-type{border-top:0;padding-top:.2em}
.prog h3{font:700 1.3em/1.2 var(--serif);color:var(--crimson);margin:0 0 .3em}
.prog dl{margin:0;display:grid;grid-template-columns:6.4em minmax(0,1fr);column-gap:.8em;row-gap:.16em;font-family:var(--sans);font-size:1.06em;line-height:1.36;font-variant-numeric:lining-nums}
.prog dt{color:var(--soft)}
.prog dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.prog dd span{display:block}
.prog dd a{color:inherit;text-decoration:underline;text-decoration-color:#a01c3359;text-underline-offset:.16em}

/* author */
.author{font-size:1.08em;line-height:1.56}
.author h2{font:500 2.25em/1.1 var(--serif);margin:0 0 .28em}
.author .credo{font-style:italic;font-weight:500;font-size:1.46em;line-height:1.2;color:var(--crimson);margin-bottom:.8em}
.author p+p{margin-top:.75em}
.author .logos{width:19em;height:auto;margin:auto 0 0 auto;padding-top:1em}

/* ---------- reading view ---------- */
.reader{border:0;width:min(760px,100vw);height:min(94dvh,1000px);max-width:100vw;max-height:100dvh;border-radius:4px;box-shadow:0 24px 90px #000000a6;background:var(--paper);color:var(--ink);padding:0}
.reader::backdrop{background:#1a070ce6}
.reader[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.reader-head,.reader-foot{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper)}
.reader-head{border-bottom:1px solid var(--rule)}.reader-foot{border-top:1px solid var(--rule)}
.reader-title{font:500 16px/1.2 var(--serif);font-style:italic;color:var(--soft)}
.reader .tool-icon,.reader .btn,.programme-editor .tool-icon,.programme-editor .btn,.programme-editor .utility{color:var(--ink);border-color:#cfc5b9}

<template id="tpl-cover"><div class="pc cover">
  <p class="shloka" lang="sa">साधूनां दर्शनं पुण्यं तीर्थभूता हि साधवः ।<br>कालेन फलते तीर्थं सद्यः साधुसमागमः ॥</p>
  <p class="gloss">To meet good people is itself a blessing. A&nbsp;pilgrimage bears fruit in time. Their company bears fruit at once.</p>
  <p class="invite">It would be my good fortune to launch my first book in your company.</p>
  <img class="art" data-asset="art" width="1232" height="1094" alt="MAXIM(um) MANAGEMENT. Decoding Management Maxims, from Jargon to Judgment. Hitesh Ahuja. Cover art: a single ray labelled Maxims passes through a prism and fans into Context, Judgment, Trade-offs, Execution, Consequence, Incentives and Wisdom.">
</div></template>

<template id="tpl-letter"><div class="pc letter">
  <p class="salute" data-greeting>Greetings,</p>
  <div class="verse"><span>Sight and sound give rise to experience.</span><span>Experience turns into thought.</span><span>Thought finds expression in words.</span></div>
  <p>Spoken words dissipate. Written words accumulate. Sometimes they gather in the wells of diaries, journals and notebooks.</p>
  <p>Until one day the universe decides the time is nigh. Guardian angels, inspiration and a little serendipity conspire to draw the words from those wells and let them flow into manuscripts and books.</p>
  <p>Perhaps that is how civilisations move from one age to the next. It is how I find myself moving into the next phase of my life.</p>
  <p>My guardian angels, my wife Shikha and my daughter Aadya, always believed I should write. They saw a writer in me long before I found the time to look for him myself.</p>
  <p>I would be honoured if you could be with us for the launch at the Mumbai Book Festival. Your presence would mean a great deal to me as I take yet another step into the unknown.</p>
  <p class="close">Warmly,</p>
  <p class="sign">Hitesh</p>
</div></template>

<template id="tpl-ifever"><div class="pc ifever">
  <p class="couplet"><span>If you have ever asked a valid question</span><span>and been told not to be curious,</span></p>
  <p class="couplet"><span>if you have ever done the work</span><span>and been asked to disappear into the team,</span></p>
  <p class="couplet"><span>if you have ever raised a red flag</span><span>and been dismissed as disruptive,</span></p>
  <p class="couplet"><span>if you have ever seen lack of application</span><span>masquerade as smart work,</span></p>
  <p class="couplet"><span>if you have ever seen shortcuts</span><span>sold as strategic prioritization,</span></p>
  <p class="couplet"><span>if you have ever faced apathy toward synthesis</span><span>in the name of specialized focus,</span></p>
  <p class="couplet"><span>if you have ever seen shallow confidence</span><span>borrow the language of wisdom,</span></p>
  <p class="turn">then, in one way or another, you have seen</p>
  <p class="verdict">Management through Maxims <i>pretending to be</i> Maxim(um) Management.</p>
</div></template>

<template id="tpl-about"><div class="pc about">
  <p class="lead">Maxims survive because they are useful.</p>
  <p>A good maxim compresses experience into memory. It takes a messy truth and turns it into a sentence sharp enough to travel across generations.</p>
  <p class="danger">But that is also the danger.</p>
  <p>A maxim is not a law of nature. It is a tool of judgment. It works only when applied to the right context. The same line that brings clarity in one situation can create confusion in another. The same advice that saves one decision can damage the next.</p>
  <p>This book is an attempt to decode and deconstruct popular maxims through</p>
  <ul class="lenses">
    <li style="--ray:#cf3350">Context</li><li style="--ray:#e0802e">Interpretation</li><li style="--ray:#d1a927">Nuance</li><li style="--ray:#3f9f70">Paradox</li>
    <li style="--ray:#3391c4">Consequence</li><li style="--ray:#4553a8">Dogma</li><li style="--ray:#9257ab">and Wisdom.</li>
  </ul>
  <p class="aim">The aim is simple: to transform Management through Maxims into <b>Maxim(um) Management</b></p>
</div></template>

<template id="tpl-programme"><div class="pc prog" data-programme></div></template>

<template id="tpl-author"><div class="pc author">
  <h2>About the Author</h2>
  <p class="credo">“I think because I am; I am because I think.”</p>
  <p>For Hitesh Ahuja, this is more than a personal credo. It expresses his understanding of what makes human existence distinctly human.</p>
  <p>To him, God, or the Creator, is the ultimate genius, and the human capacity to think is the closest reflection of that genius within us. We do not exist as humans merely because we breathe and survive. We exist as humans because we can think: question, understand, judge, imagine, and create. Thinking is therefore both the reason we exist as humans and our sacred duty. To use the mind consciously and independently is, in his view, the truest form of worship.</p>
  <p>This conviction has shaped the life and work of Hitesh, an architect with an MBA from the Indian School of Business (ISB). A business leader, entrepreneur, author, and cross-functional thinker with over twenty-five years of experience, he is driven by an enduring need to understand how the whole system works.</p>
  <p><em class="title">Maxim(um) Management</em> is a natural outcome of this journey: a synthesis of logic and imagination, curiosity and experience, and a need to look beneath established answers to understand when they hold, when they fail, and why.</p>
  <img class="logos" data-asset="logos" width="707" height="234" alt="Nu Voice Press. Exclusive distribution by Penguin Random House India.">
</div></template>

<script>
'use strict';
const pages=JSON.parse(document.querySelector('#page-data').textContent);
const el=id=>document.getElementById(id);
const book=el('book'), stage=el('stage'), dialog=el('reader'), music=el('music');
const narrow=matchMedia('(max-width:800px)'), reduce=matchMedia('(prefers-reduced-motion:reduce)');
let selected=0, doublePage=false, busy=false, musicChoice=null, userOpened=false;
let readerPage=0, swipeStart=null, pendingLayout=false;
const programme=JSON.parse(el('programme-data').textContent);
const fieldByKey=new Map(programme.fields.map(f=>[f.key,f]));
const programmePage=pages.findIndex(p=>p.tpl==='programme'), letterPage=pages.findIndex(p=>p.tpl==='letter');
const letter=JSON.parse(el('letter-data').textContent);
const guestInput=el('guest-name');
el('guest-personalization').hidden=!letter.personal;
const assets={};
for(const s of document.querySelectorAll('script[id^="asset-"]'))assets[s.id.slice(6)]='data:'+s.dataset.type+';base64,'+s.textContent.trim();

// Capture the clean, standalone invitation before any guest or editor state is drawn.
const invitationSource=document.documentElement.cloneNode(true);

function greeting(){return letter.personal&&letter.name?'Dear '+letter.name+',':'Greetings,';}
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}

function valueNode(text){
  // One line per ";"-separated entry; phone numbers become tap-to-call links.
  const dd=node('dd');
  for(const part of text.split(/\s*;\s*/)){
    const line=node('span');let last=0;
    for(const m of part.matchAll(/\+?\d[\d\s-]{8,}\d/g)){
      line.append(part.slice(last,m.index));
      const a=node('a',null,m[0]);a.href='tel:'+m[0].replace(/[^\d+]/g,'');line.append(a);last=m.index+m[0].length;
    }
    line.append(part.slice(last));dd.append(line);
  }
  return dd;
}
function buildProgramme(root){
  for(const line of programme.opening)root.append(node('p','welcome',line));
  const mark=node('div','mark');mark.setAttribute('aria-hidden','true');
  mark.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 4 21 20H3z"/></svg>';
  root.append(mark,node('h2',null,programme.programme_title));
  for(const section of programme.sections){
    const sec=node('section');sec.append(node('h3',null,section.title));
    const dl=node('dl');
    for(const key of section.fields){const f=fieldByKey.get(key);dl.append(node('dt',null,f.label),valueNode(f.value));}
    sec.append(dl);root.append(sec);
  }
}
function content(i){
  const frag=el('tpl-'+pages[i].tpl).content.cloneNode(true);
  frag.querySelectorAll('[data-asset]').forEach(im=>{im.src=assets[im.dataset.asset];im.draggable=false;});
  frag.querySelectorAll('[data-greeting]').forEach(n=>n.textContent=greeting());
  frag.querySelectorAll('[data-programme]').forEach(buildProgramme);
  return frag;
}
function pageNode(i,hide=false){
  const pg=node('div','pg pg-'+pages[i].tpl);pg.append(content(i));
  if(hide||pages[i].blank)pg.setAttribute('aria-hidden','true');
  return pg;
}

/* ---------- editor ---------- */
const editor=el('programme-editor'), programmeForm=el('programme-form'), editProgrammeButton=el('edit-programme');
function openProgrammeEditor(){
  if((!letter.master&&location.hash!=='#edit')||editor.open)return;
  guestInput.value=letter.name;
  const fields=el('programme-fields');fields.replaceChildren();
  for(const section of programme.sections){
    const group=node('fieldset');group.append(node('legend',null,section.title));
    for(const key of section.fields){
      const field=fieldByKey.get(key), label=node('label'), input=node('input');
      input.type='text';input.name=key;input.value=field.value;input.maxLength=field.maxLength;input.required=true;
      label.append(node('span',null,field.label||section.title),input);group.append(label);
    }
    fields.append(group);
  }
  resetTrackEditor();editor.showModal();
}
function editorRoute(){
  const active=letter.master||location.hash==='#edit';
  editProgrammeButton.hidden=!active;
  if(active)openProgrammeEditor();else if(editor.open)editor.close();
}
editProgrammeButton.addEventListener('click',openProgrammeEditor);
el('programme-cancel').addEventListener('click',()=>editor.close());
window.addEventListener('hashchange',editorRoute);

function saveInvitation(){
  const copy=invitationSource.cloneNode(true);
  copy.querySelector('#programme-data').textContent=JSON.stringify(programme,null,2).replace(/</g,'\\u003c');
  const cleanLetter={personal:letter.personal,master:false,name:letter.personal?letter.name:''};
  copy.querySelector('#letter-data').textContent=JSON.stringify(cleanLetter).replace(/</g,'\\u003c');
  const audioCopy=copy.querySelector('#audio-data');
  audioCopy.textContent=soundtrackData;audioCopy.setAttribute('data-name',soundtrackName);
  const blob=new Blob(['<!doctype html>\n',copy.outerHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url;
  const nameInFile=letter.name.normalize('NFC').replace(/[<>:"/\\|?*\u0000-\u001F]/g,'').trim().replace(/\s+/g,'_');
  link.download='MM_Invitation_'+(nameInFile||'Greetings')+'.html';
  document.body.append(link);link.click();link.remove();
  window.setTimeout(()=>URL.revokeObjectURL(url),5000);
}
programmeForm.addEventListener('submit',event=>{
  event.preventDefault();
  if(readingTrack||!programmeForm.reportValidity())return;
  for(const field of programme.fields){
    const input=programmeForm.elements.namedItem(field.key);
    if(!input.value.trim()){input.focus();return;}
  }
  for(const field of programme.fields)field.value=programmeForm.elements.namedItem(field.key).value.trim();
  const newName=letter.personal?guestInput.value.trim().replace(/\s+/g,' '):'';
  const nameChanged=newName!==letter.name;
  letter.name=newName;
  applyDraftTrack();
  if(event.submitter?.value!=='preview')saveInvitation();
  editor.close();
  selected=(nameChanged||letter.master)?letterPage:programmePage;
  render();
});

/* ---------- book ---------- */
function group(page){
  if(!doublePage||page===0||page===pages.length-1)return [page];
  const first=(page%2===0)?page-1:page;
  return [first,first+1].filter(i=>i<pages.length);
}
function adjacentContent(page,step){
  let i=page+step;
  while(i>=0&&i<pages.length&&pages[i].blank)i+=step;
  return i;
}
function focusPage(page){return pages[page].blank?group(page).find(i=>!pages[i].blank):page;}
function sheet(i,position){
  const s=node('div','sheet '+position);s.append(pageNode(i));
  if(pages[i].blank)return s;
  s.title='Double-click to read “'+pages[i].name+'” in larger type';
  s.addEventListener('dblclick',()=>openReader(i));return s;
}
function layout(){
  if(busy){pendingLayout=true;return;}
  doublePage=!narrow.matches;
  const A=210/148, sw=stage.clientWidth, sh=stage.clientHeight;
  const margin=sh<350?8:(doublePage?52:22), n=doublePage?2:1;
  let w=Math.min((sw-margin)/n,660), h=sh-margin;
  // On a phone the page may grow taller than A5 so the type can be larger.
  const tallest=doublePage?A:1.74;
  if(h/w>tallest)h=w*tallest;
  if(h/w<A)w=h/A;
  w=Math.max(40,w);h=Math.max(57,h);
  const unit=w/40*Math.sqrt((h/w)/A);
  book.style.setProperty('--pw',w+'px');book.style.setProperty('--u',unit+'px');
  book.style.width=(w*n)+'px';book.style.height=h+'px';
  render();
}
// Safety net: if a page's text runs past the bottom (long guest name, long venue), ease its type down until it fits.
function fit(root){
  root.querySelectorAll('.pg>.pc').forEach(c=>{
    c.style.fontSize='';
    const base=parseFloat(getComputedStyle(c).fontSize);let s=1;
    while(c.scrollHeight>c.clientHeight+2&&s>.78){s-=.02;c.style.fontSize=(base*s)+'px';}
  });
}
function showSheets(indices){
  book.replaceChildren();
  indices.forEach((i,j)=>book.append(sheet(i,indices.length===1?'solo':j?'right':'left')));
  fit(book);
}
function controls(){
  const g=group(selected), last=g[g.length-1];
  el('count').textContent=g.length===1?'Page '+(g[0]+1)+' of '+pages.length:'Pages '+(g[0]+1)+'–'+(last+1)+' of '+pages.length;
  el('prev').disabled=g[0]===0;
  el('next-label').textContent=last===pages.length-1?'Back to cover':g[0]===0?'Open invitation':'Next';
  el('next').setAttribute('aria-label',el('next-label').textContent);
}
function render(){showSheets(group(selected));controls();}

/* ---------- soundtrack ---------- */
const audioData=el('audio-data');
let soundtrackData=audioData.textContent.trim();
let soundtrackName=audioData.getAttribute('data-name')||'';
let draftTrack='', draftName='', readingTrack=false, readGeneration=0;
const trackPreview=el('track-preview'), filePicker=el('track-file');
function audioURL(encoded){return 'data:audio/mpeg;base64,'+encoded;}
function renderTrackEditor(message){
  el('track-status').textContent=message||draftName||'No soundtrack selected';
  el('track-remove').hidden=!draftTrack;
  trackPreview.hidden=!draftTrack;trackPreview.pause();
  if(draftTrack)trackPreview.src=audioURL(draftTrack);else trackPreview.removeAttribute('src');
  trackPreview.load();
}
function resetTrackEditor(){
  readGeneration++;readingTrack=false;filePicker.value='';
  draftTrack=soundtrackData;draftName=soundtrackName;music.pause();renderTrackEditor();
}
filePicker.addEventListener('change',()=>{
  const file=filePicker.files[0], generation=++readGeneration;
  readingTrack=false;
  if(!file)return;
  if(!file.size||!(/\.mp3$/i.test(file.name)||file.type==='audio/mpeg')){filePicker.value='';renderTrackEditor('Choose an MP3 audio file.');return;}
  readingTrack=true;el('track-status').textContent='Loading soundtrack…';
  const reader=new FileReader();
  reader.onload=()=>{if(generation!==readGeneration)return;readingTrack=false;draftTrack=String(reader.result).split(',')[1];draftName=file.name;renderTrackEditor();};
  reader.onerror=()=>{if(generation!==readGeneration)return;readingTrack=false;renderTrackEditor('The file could not be read. Please choose it again.');};
  reader.readAsDataURL(file);
});
el('track-remove').addEventListener('click',()=>{readGeneration++;readingTrack=false;draftTrack='';draftName='';filePicker.value='';renderTrackEditor();});
editor.addEventListener('close',()=>{readGeneration++;readingTrack=false;trackPreview.pause();});
function applyDraftTrack(){
  if(soundtrackData!==draftTrack){soundtrackData=draftTrack;music.pause();music.removeAttribute('src');music.load();musicChoice=null;}
  soundtrackName=draftName;syncSound();
}
function syncSound(){
  const active=!music.paused&&!music.ended;
  const action=active?'Pause music':music.ended?'Replay music':'Play music';
  el('sound').hidden=!soundtrackData;
  el('sound').setAttribute('aria-pressed',String(active));
  el('sound').setAttribute('aria-label',action);
  el('sound-label').textContent=action;
}
const fullVolume=.72;let fadeTimer=0;
function playMusic(fade){
  if(!soundtrackData)return Promise.resolve(false);
  if(!music.getAttribute('src'))music.src=audioURL(soundtrackData);
  if(music.ended)music.currentTime=0;
  clearInterval(fadeTimer);
  if(fade){
    // Rise from silence over about five seconds.
    music.volume=0;const began=performance.now();
    fadeTimer=setInterval(()=>{
      const k=Math.min(1,(performance.now()-began)/5000);
      music.volume=fullVolume*k*k;
      if(k>=1||music.paused)clearInterval(fadeTimer);
    },80);
  }else music.volume=fullVolume;
  return music.play().then(()=>{syncSound();return true;}).catch(()=>{clearInterval(fadeTimer);syncSound();return false;});
}
// The music begins on the cover. Browsers refuse sound before the guest touches the page,
// so if the first attempt is refused it starts with their first tap, click or key press instead.
const wakeEvents=['pointerdown','keydown','touchend'];
function autoStart(){
  if(musicChoice!==null||!soundtrackData||editor.open||!music.paused)return;
  playMusic(true).then(started=>{if(started)wakeEvents.forEach(n=>window.removeEventListener(n,autoStart,true));});
}
wakeEvents.forEach(n=>window.addEventListener(n,autoStart,true));
function firstGesture(){userOpened=true;autoStart();}
el('sound').onclick=()=>{
  if(music.paused||music.ended){musicChoice=true;playMusic(false);}else{musicChoice=false;music.pause();}
  syncSound();
};
for(const event of ['play','pause','ended'])music.addEventListener(event,syncSound);
syncSound();

/* ---------- turning pages ---------- */
function finish(page){selected=focusPage(page);busy=false;render();if(pendingLayout){pendingLayout=false;layout();}}
function go(forward){
  if(busy)return;
  const old=group(selected);
  const step=forward?1:-1, edge=forward?old[old.length-1]:old[0];
  const dest=doublePage?edge+step:adjacentContent(edge,step);
  if(dest>=pages.length){finish(0);return;} if(dest<0)return;
  firstGesture();
  const target=group(dest);
  if(reduce.matches||typeof Element.prototype.animate!=='function'){finish(dest);return;}
  busy=true;
  const width=parseFloat(book.style.getPropertyValue('--pw'));
  const turn=node('div','leaf');turn.setAttribute('aria-hidden','true');
  const front=node('div','face front'), back=node('div','face back');
  front.append(pageNode(forward?old[old.length-1]:old[0],true));
  back.append(pageNode(forward?target[0]:target[target.length-1],true));
  turn.append(front,back);let from,to;
  if(doublePage){
    book.replaceChildren();
    if(old.length===2)book.append(sheet(forward?old[0]:old[1],forward?'left':'right'));
    if(target.length===2)book.append(sheet(forward?target[1]:target[0],forward?'right':'left'));
    turn.style.left=forward?'50%':'0';turn.style.transformOrigin=forward?'left center':'right center';
    const sign=forward?-1:1,startShift=old.length===1?sign*width/2:0,endShift=target.length===1?-sign*width/2:0;
    from={transform:'translateX('+startShift+'px) rotateY(0deg)'};
    to={transform:'translateX('+endShift+'px) rotateY('+(sign*180)+'deg)'};
  }else{
    showSheets(target);turn.style.left='0';turn.style.transformOrigin=forward?'left center':'right center';
    from={transform:'rotateY(0deg)',opacity:1};
    to={transform:'rotateY('+(forward?-95:95)+'deg)',opacity:.15};
  }
  book.append(turn);fit(book);
  const anim=turn.animate([from,to],{duration:doublePage?640:430,easing:'cubic-bezier(.36,.05,.22,1)',fill:'forwards'});
  anim.finished.then(()=>finish(dest)).catch(()=>finish(dest));
}
el('next').onclick=()=>go(true);el('prev').onclick=()=>go(false);
stage.addEventListener('touchstart',e=>{swipeStart=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null;},{passive:true});
stage.addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart[0],dy=e.changedTouches[0].clientY-swipeStart[1];swipeStart=null;if(Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0);},{passive:true});
stage.addEventListener('touchcancel',()=>swipeStart=null);

/* ---------- reading view: the same page, reflowed in larger type ---------- */
function drawReader(){
  const body=el('reader-body'), article=node('article','flow');
  article.append(content(readerPage));body.replaceChildren(article);
  const readable=pages.filter(p=>!p.blank), at=readable.indexOf(pages[readerPage])+1;
  el('reader-title').textContent=pages[readerPage].name;
  el('reader-count').textContent=at+' of '+readable.length;
  el('reader-prev').disabled=adjacentContent(readerPage,-1)<0;
  el('reader-next').disabled=adjacentContent(readerPage,1)>=pages.length;
  body.scrollTo(0,0);
}
function openReader(i){firstGesture();readerPage=focusPage(i);dialog.showModal();drawReader();}
function readerTurn(dir){const i=adjacentContent(readerPage,dir);if(i>=0&&i<pages.length){readerPage=i;drawReader();}}
el('reader-open').onclick=()=>openReader(group(selected).find(i=>!pages[i].blank));
el('reader-close').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>{selected=readerPage;render();el('reader-open').focus();});
el('reader-prev').onclick=()=>readerTurn(-1);el('reader-next').onclick=()=>readerTurn(1);
window.addEventListener('keydown',e=>{
  if(editor.open||e.altKey||e.metaKey||e.ctrlKey||e.shiftKey)return;
  const back=e.key==='ArrowLeft',fwd=e.key==='ArrowRight';if(!(back||fwd))return;
  e.preventDefault();
  if(dialog.open)readerTurn(fwd?1:-1);else go(fwd);
});
new ResizeObserver(layout).observe(stage);narrow.addEventListener('change',layout);layout();editorRoute();autoStart();
</script></body></html>
